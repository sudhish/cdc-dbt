version: 2

models:
  - name: stg_products
    description: Cleaned and standardized product data from the bookstore catalog
    columns:
      - name: product_id
        description: Unique identifier for each product
        tests:
          - unique
          - not_null
      - name: title
        description: Book title
        tests:
          - not_null
      - name: author
        description: Book author name
        tests:
          - not_null
      - name: price
        description: Book price in USD
        tests:
          - not_null

  - name: stg_customers
    description: Cleaned and standardized customer data
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - unique
          - not_null
      - name: email
        description: Customer email address (lowercase)
        tests:
          - unique
          - not_null

  - name: stg_sales
    description: Cleaned and standardized sales transaction data
    columns:
      - name: sale_id
        description: Unique identifier for each sale transaction
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Reference to customer who made the purchase
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: product_id
        description: Reference to product that was sold
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

  - name: fct_sales
    description: Fact table containing all sales transactions with denormalized dimensions
    columns:
      - name: sale_id
        description: Unique sale transaction identifier
        tests:
          - unique
          - not_null

  - name: customer_summary
    description: Aggregated customer metrics and segmentation
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null
