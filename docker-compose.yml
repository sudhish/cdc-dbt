services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: dbt-cdc-pipeline
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
      PIPELINE_MODE: once
      CDC_POLL_INTERVAL: 30
      LOG_LEVEL: INFO
    volumes:
      - ./data:/data
      - ./dbt_project:/app/dbt_project
      - ./cdc_pipeline:/app/cdc_pipeline
    command: python /app/cdc_pipeline/orchestrator.py
