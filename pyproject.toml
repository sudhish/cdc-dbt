[project]
name = "dbt-cdc-demo"
version = "0.1.0"
description = "DBT demo with CDC and SCD using DuckDB with simulated source system"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.8.0",
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
    "faker>=22.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
]
